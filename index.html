<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anime & Gaming Quiz — Tik-Tok Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: #080711;
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(20, 18, 38, 0.95);
      border: 2px solid rgba(192, 132, 252, 0.3);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(192, 132, 252, 0.15);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .title {
      font-size: 26px;
      font-weight: 900;
      background: linear-gradient(135deg, #f472b6, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid rgba(192, 132, 252, 0.4);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #f472b6, #c084fc);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(244, 114, 182, 0.3);
      transition: transform 0.1s;
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Таймер-бар */
    .timer-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #38bdf8;
      transition: width 0.1s linear;
    }

    .question-box {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 20px;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .option-btn {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn:active {
      background: rgba(192, 132, 252, 0.2);
    }

    /* ТАБЛИЦА ЛИДЕРОВ */
    .leaderboard {
      margin-top: 20px;
      text-align: left;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px;
      border-radius: 12px;
      max-height: 180px;
      overflow-y: auto;
    }

    .lb-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 13px;
    }

    .lb-rank {
      color: #f472b6;
      font-weight: 800;
      width: 25px;
    }
  </style>
</head>
<body>

  <div class="card" id="start-screen">
    <div class="title">ANIME & GAME QUIZ</div>
    <div class="subtitle">⚡ Проверь себя за 3 секунды и заними ТОП-1!</div>
    
    <input type="text" id="player-nickname" placeholder="Введи твой ник (для ТОПа)" maxlength="15">
    <button class="btn" onclick="startQuiz()">НАЧАТЬ ТЕСТ 🚀</button>

    <div class="leaderboard" id="main-lb">
      <div style="font-weight: 800; font-size: 12px; color: #c084fc; margin-bottom: 8px;">🏆 ТОП ИГРОКОВ:</div>
      <div id="lb-list"></div>
    </div>
  </div>

  <div class="card" id="quiz-screen" style="display: none;">
    <div class="timer-container">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="question-box" id="question-text">Загрузка вопроса...</div>

    <div class="options-grid" id="options-container"></div>
  </div>

  <div class="card" id="result-screen" style="display: none;">
    <div class="title">РЕЗУЛЬТАТ</div>
    <div class="subtitle" id="result-score-text">Ты набрал 0 очков!</div>

    <button class="btn" onclick="location.reload()">ПРОЙТИ ЕЩЁ РАЗ 🔄</button>

    <div class="leaderboard" style="margin-top: 20px;">
      <div style="font-weight: 800; font-size: 12px; color: #c084fc; margin-bottom: 8px;">🏆 ТОП ИГРОКОВ:</div>
      <div id="res-lb-list"></div>
    </div>
  </div>

  <script>
    // База вопросов (Сюда легко добавлять новые вопросы под твои ролики!)
    const questions = [
      {
        q: "🎵 Из какого аниме опенинг «Unravel»?",
        options: ["Токийский Гуль", "Атака Титанов", "Клинок рассекающий демонов", "Наруто"],
        correct: 0
      },
      {
        q: "🗡️ Кто главный герой аниме «Провожающая в последний путь Фрирен»?",
        options: ["Ферн", "Фрирен", "Штарк", "Гимли"],
        correct: 1
      },
      {
        q: "🎮 Какая фишка используется для ускорения в Crystal PvP в Minecraft?",
        options: ["Элитра", "Якорь Возрождения", "Кристалл Энда", "Обсидиан"],
        correct: 2
      },
      {
        q: "⚡ Сколько духов всего было у Сидо в «Date A Live»?",
        options: ["5", "8", "10+", "3"],
        correct: 2
      }
    ];

    let currentQ = 0;
    let score = 0;
    let timer;
    let timeLeft = 100; // %
    let nickname = "Игрок";

    function updateLeaderboardUI() {
      const lb = JSON.parse(localStorage.getItem('quiz_lb') || '[]');
      let html = '';
      lb.sort((a, b) => b.score - a.score);

      lb.slice(0, 5).forEach((item, index) => {
        html += `
          <div class="lb-item">
            <span><span class="lb-rank">#${index + 1}</span> ${item.name}</span>
            <span style="font-weight:800; color:#38bdf8;">${item.score} очков</span>
          </div>
        `;
      });

      document.getElementById('lb-list').innerHTML = html || 'Пока нет рекордов. Будь первым!';
      document.getElementById('res-lb-list').innerHTML = html;
    }

    function startQuiz() {
      const inputNick = document.getElementById('player-nickname').value.trim();
      if (inputNick) nickname = inputNick;

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('quiz-screen').style.display = 'block';

      showQuestion();
    }

    function showQuestion() {
      if (currentQ >= questions.length) {
        endQuiz();
        return;
      }

      const qData = questions[currentQ];
      document.getElementById('question-text').textContent = qData.q;

      const optsContainer = document.getElementById('options-container');
      optsContainer.innerHTML = '';

      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = `${idx + 1}. ${opt}`;
        btn.onclick = () => checkAnswer(idx);
        optsContainer.appendChild(btn);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(timer);
      timeLeft = 100;
      const bar = document.getElementById('timer-bar');

      timer = setInterval(() => {
        timeLeft -= 2.5; // Скорость таймера (примерно 4 секунды на вопрос)
        bar.style.width = `${timeLeft}%`;

        if (timeLeft <= 0) {
          clearInterval(timer);
          checkAnswer(-1); // Время вышло
        }
      }, 100);
    }

    function checkAnswer(selectedIdx) {
      clearInterval(timer);
      const qData = questions[currentQ];

      if (selectedIdx === qData.correct) {
        score += Math.round(100 * (timeLeft / 100)) + 50; // Бонус за скорость
      }

      currentQ++;
      showQuestion();
    }

    function endQuiz() {
      document.getElementById('quiz-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';

      document.getElementById('result-score-text').textContent = `${nickname}, твой результат: ${score} очков!`;

      // Сохраняем результат
      let lb = JSON.parse(localStorage.getItem('quiz_lb') || '[]');
      lb.push({ name: nickname, score: score });
      localStorage.setItem('quiz_lb', JSON.stringify(lb));

      updateLeaderboardUI();
    }

    updateLeaderboardUI();
  </script>
</body>
</html>
