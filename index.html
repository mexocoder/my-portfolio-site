<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEME TAC TOE 😼🔥</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #333;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 2px 2px #fff;
    }

    .status {
      font-size: 1.4rem;
      margin-bottom: 20px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.6);
      padding: 8px 16px;
      border-radius: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 10px;
      background: #fff;
      padding: 10px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    .cell {
      background: #f0f0f0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s, background-color 0.2s;
    }

    .cell:hover {
      background: #e0e0e0;
      transform: scale(1.03);
    }

    .cell.taken {
      cursor: not-allowed;
    }

    .cell.winning {
      background: #a8ff78;
      animation: pulse 0.6s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }

    .controls {
      margin-top: 25px;
      display: flex;
      gap: 15px;
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 25px;
      background: #6c5ce7;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
      transition: all 0.2s;
    }

    button:hover {
      background: #5b4bc4;
      transform: translateY(-2px);
    }

    .score-board {
      margin-top: 15px;
      display: flex;
      gap: 20px;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <h1>MEME TAC TOE 😼</h1>
  <div class="status" id="status">Ход: Pop Cat 🐱</div>

  <div class="board" id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div class="score-board">
    <div>🐱 Pop Cat: <span id="scoreX">0</span></div>
    <div>🐶 Doge: <span id="scoreO">0</span></div>
  </div>

  <div class="controls">
    <button id="resetBtn">Перезапустить</button>
    <button id="chaosBtn" style="background: #ff7675;">Режим ХАОС: Вкл</button>
  </div>

  <script>
    const P1 = '🐱'; // Можно заменить на <img> теги
    const P2 = '🐶';

    let boardState = Array(9).fill(null);
    let currentPlayer = P1;
    let gameActive = true;
    let moveCount = 0;
    let chaosMode = true;

    let score = { X: 0, O: 0 };

    const statusDisplay = document.getElementById('status');
    const cells = document.querySelectorAll('.cell');
    const resetBtn = document.getElementById('resetBtn');
    const chaosBtn = document.getElementById('chaosBtn');

    const winningConditions = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8], // Строки
      [0, 3, 6], [1, 4, 7], [2, 5, 8], // Столбцы
      [0, 4, 8], [2, 4, 6]             // Диагонали
    ];

    function handleCellClick(e) {
      const clickedCell = e.target;
      const index = parseInt(clickedCell.getAttribute('data-index'));

      if (boardState[index] !== null || !gameActive) return;

      makeMove(index, currentPlayer);

      if (checkWin()) {
        statusDisplay.textContent = `Победил ${currentPlayer}! 🎉`;
        gameActive = false;
        if (currentPlayer === P1) score.X++; else score.O++;
        updateScore();
        return;
      }

      if (boardState.every(cell => cell !== null)) {
        statusDisplay.textContent = 'Ничья! 🤝';
        gameActive = false;
        return;
      }

      // Переход хода
      currentPlayer = currentPlayer === P1 ? P2 : P1;
      moveCount++;

      // РЕЖИМ ХАОСА: Каждый 4-й ход метеорит уничтожает случайную занятую клетку!
      if (chaosMode && moveCount > 0 && moveCount % 4 === 0) {
        triggerChaosEvent();
      } else {
        statusDisplay.textContent = `Ход: ${currentPlayer}`;
      }
    }

    function makeMove(index, player) {
      boardState[index] = player;
      cells[index].textContent = player;
      cells[index].classList.add('taken');
    }

    function triggerChaosEvent() {
      const occupiedIndices = boardState
        .map((val, idx) => val !== null ? idx : null)
        .filter(val => val !== null);

      if (occupiedIndices.length === 0) return;

      const randomIndex = occupiedIndices[Math.floor(Math.random() * occupiedIndices.length)];
      
      statusDisplay.textContent = `💥 МЕТЕОРИТ уничтожил клетку ${randomIndex + 1}!`;
      
      setTimeout(() => {
        boardState[randomIndex] = null;
        cells[randomIndex].textContent = '💥';
        
        setTimeout(() => {
          cells[randomIndex].textContent = '';
          cells[randomIndex].classList.remove('taken');
          statusDisplay.textContent = `Ход: ${currentPlayer}`;
        }, 800);
      }, 300);
    }

    function checkWin() {
      for (let condition of winningConditions) {
        const [a, b, c] = condition;
        if (boardState[a] && boardState[a] === boardState[b] && boardState[a] === boardState[c]) {
          cells[a].classList.add('winning');
          cells[b].classList.add('winning');
          cells[c].classList.add('winning');
          return true;
        }
      }
      return false;
    }

    function updateScore() {
      document.getElementById('scoreX').textContent = score.X;
      document.getElementById('scoreO').textContent = score.O;
    }

    function resetGame() {
      boardState = Array(9).fill(null);
      currentPlayer = P1;
      gameActive = true;
      moveCount = 0;
      statusDisplay.textContent = `Ход: ${currentPlayer}`;
      cells.forEach(cell => {
        cell.textContent = '';
        cell.classList.remove('taken', 'winning');
      });
    }

    chaosBtn.addEventListener('click', () => {
      chaosMode = !chaosMode;
      chaosBtn.textContent = `Режим ХАОС: ${chaosMode ? 'Вкл' : 'Выкл'}`;
      chaosBtn.style.background = chaosMode ? '#ff7675' : '#b2bec3';
    });

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
    resetBtn.addEventListener('click', resetGame);
  </script>
</body>
</html>
