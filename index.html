      font-size: 1rem;

      background: #00ff00;

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>COLD WAR: TAC TOE 🛠️🎩</title>
  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 { color: #e74c3c; text-transform: uppercase; letter-spacing: 2px; }
    .status { font-size: 1.2rem; margin-bottom: 15px; color: #f1c40f; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 8px;
      background: #333;
      padding: 10px;
      border: 3px solid #e74c3c;
    }
    .cell {
      width: 100px;
      height: 100px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      cursor: pointer;
      border: 1px solid #444;
    }
    .cell:hover { background: #2a2a2a; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #e74c3c;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #c0392b; }
  </style>
</head>
<body>

  <h1>СССР vs США 🛠️🎩</h1>
  <div class="status" id="status">Ход: Товарищ 🛠️</div>

  <div class="board" id="board">
    <div class="cell" data-idx="0"></div>
    <div class="cell" data-idx="1"></div>
    <div class="cell" data-idx="2"></div>
    <div class="cell" data-idx="3"></div>
    <div class="cell" data-idx="4"></div>
    <div class="cell" data-idx="5"></div>
    <div class="cell" data-idx="6"></div>
    <div class="cell" data-idx="7"></div>
    <div class="cell" data-idx="8"></div>
  </div>

  <button onclick="resetGame()">Перезапустить противостояние</button>

  <script>
    const P1 = '🛠️'; // СССР
    const P2 = '🎩'; // США
    let board = Array(9).fill(null);
    let turn = P1;
    let active = true;

    const wins = [
      [0,1,2], [3,4,5], [6,7,8],
      [0,3,6], [1,4,7], [2,5,8],
      [0,4,8], [2,4,6]
    ];

    document.querySelectorAll('.cell').forEach(cell => {
      cell.addEventListener('click', (e) => {
        const idx = e.target.dataset.idx;
        if (board[idx] || !active) return;

        board[idx] = turn;
        e.target.textContent = turn;

        if (checkWin()) {
          document.getElementById('status').textContent = `Победила сторона: ${turn}! 🎉`;
          active = false;
          return;
        }

        if (board.every(c => c)) {
          document.getElementById('status').textContent = 'Мирные переговоры (Ничья)! 🤝';
          active = false;
          return;
        }

        turn = turn === P1 ? P2 : P1;
        document.getElementById('status').textContent = `Ход: ${turn === P1 ? 'Товарищ 🛠️' : 'Капиталист 🎩'}`;
      });
    });

    function checkWin() {
      return wins.some(w => w.every(idx => board[idx] === turn));
    }

    function resetGame() {
      board = Array(9).fill(null);
      turn = P1;
      active = true;
      document.getElementById('status').textContent = 'Ход: Товарищ 🛠️';
      document.querySelectorAll('.cell').forEach(c => c.textContent = '');
    }
  </script>
</body>
</html>
