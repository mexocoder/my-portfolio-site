<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Deep Space Flight</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #ui-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10,10,25,0.9) 0%, rgba(0,0,2,0.95) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            font-family: sans-serif;
            color: #fff;
            transition: opacity 0.6s ease;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 26px;
            letter-spacing: 3px;
            color: #00f2fe;
            text-shadow: 0 0 15px rgba(0, 242, 254, 0.6);
        }
        p {
            color: #a0aec0;
            margin-bottom: 30px;
            font-size: 14px;
            text-align: center;
            padding: 0 20px;
        }
        button {
            padding: 16px 36px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: #000;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.5);
        }
        #hud {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.6);
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            display: none;
        }
    </style>
</head>
<body>

    <div id="ui-overlay">
        <h1>КОСМИЧЕСКИЙ ПОЛЕТ</h1>
        <p>Нажмите экран для ускорения. Никаких сложных движений!</p>
        <button onclick="startFlight()">СТАРТ</button>
    </div>

    <div id="hud">РЕЖИМ ПОЛЕТА: АКТИВЕН [СКОРОСТЬ: СТАБИЛЬНАЯ]</div>
    <canvas id="spaceCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, starField, nebulaParticles;
        let speed = 0.5;
        let isBoosting = false;

        function startFlight() {
            // Полноэкранный режим и фиксация горизонтали
            const docElement = document.documentElement;
            if (docElement.requestFullscreen) docElement.requestFullscreen();
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(() => {});
            }

            // Плавное скрытие меню
            const overlay = document.getElementById('ui-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                document.getElementById('hud').style.display = 'block';
            }, 600);

            init3D();
        }

        // Функция генерации круглой мягкой текстуры для звезд (чтобы не было квадратов!)
        function createStarTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.3, 'rgba(200,220,255,0.8)');
            gradient.addColorStop(1, 'rgba(0,0,0,0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020208, 0.0015);

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 3000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('spaceCanvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;

            // Создаем красивое звездное поле с круглыми светящимися текстурами
            createStars();
            createNebulaDust();

            // Управление: тап по экрану дает ускорение (импульс)
            window.addEventListener('pointerdown', () => { isBoosting = true; });
            window.addEventListener('pointerup', () => { isBoosting = false; });
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createStars() {
            const count = 4000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);

            const palette = [
                new THREE.Color('#ffffff'),
                new THREE.Color('#70a1ff'),
                new THREE.Color('#ff4757'),
                new THREE.Color('#ffa502')
            ];

            for (let i = 0; i < count * 3; i += 3) {
                positions[i]     = (Math.random() - 0.5) * 2000;
                positions[i + 1] = (Math.random() - 0.5) * 2000;
                positions[i + 2] = (Math.random() - 0.5) * 2000 - 1000;

                const col = palette[Math.floor(Math.random() * palette.length)];
                colors[i]     = col.r;
                colors[i + 1] = col.g;
                colors[i + 2] = col.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 12,
                map: createStarTexture(), // Главный секрет: круглая текстура вместо квадратов
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            starField = new THREE.Points(geometry, material);
            scene.add(starField);
        }

        function createNebulaDust() {
            const count = 1000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i]     = (Math.random() - 0.5) * 1500;
                positions[i + 1] = (Math.random() - 0.5) * 1500;
                positions[i + 2] = (Math.random() - 0.5) * 2000;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const material = new THREE.PointsMaterial({
                size: 45,
                map: createStarTexture(),
                color: new THREE.Color('#1e0538'), // Фиолетово-синий космический газ
                transparent: true,
                opacity: 0.25,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            nebulaParticles = new THREE.Points(geometry, material);
            scene.add(nebulaParticles);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Плавное ускорение при удержании экрана
            let targetSpeed = isBoosting ? 4.5 : 0.6;
            speed += (targetSpeed - speed) * 0.1;

            // Двигаем звезды навстречу камере (эффект полета)
            const positions = starField.geometry.attributes.position.array;
            for (let i = 2; i < positions.length; i += 3) {
                positions[i] += speed;
                if (positions[i] > 500) {
                    positions[i] = -1500; // Возвращаем улетевшую звезду назад
                }
            }
            starField.geometry.attributes.position.needsUpdate = true;

            // Медленное вращение туманностей
            nebulaParticles.rotation.z += 0.0005;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
